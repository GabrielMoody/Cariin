services:
  reranker:
    build:
      context: ./reranker/ 
      dockerfile: Dockerfile

    container_name: cariin-reranker

    ports:
      - "8001:8001"

    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      OMP_NUM_THREADS: 4
      MKL_NUM_THREADS: 4

    volumes:
      - reranker-cache:/app/.cache/huggingface

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

volumes:
  reranker-cache: